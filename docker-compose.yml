version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./masterymind.db
      - SECRET_KEY=masterymind-production-secret-key-cbse-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/masterymind.db:/app/masterymind.db
    restart: unless-stopped
